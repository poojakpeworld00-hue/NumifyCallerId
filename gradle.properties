# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# 4 GB, up from the 2 GB template default: this module runs dataBinding +
# viewBinding codegen and R8 over ~160 Kotlin files and a large dependency set,
# and 2 GB left the daemon GC-thrashing (release builds took 9-13 min).
# MaxMetaspaceSize is capped because it is unbounded by default and grows across
# builds in a long-lived daemon. If you run an emulator alongside on a 16 GB
# machine, drop this to 3072m.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate JVM and otherwise inherits an
# unhelpful default; give it its own explicit budget.
kotlin.daemon.jvmargs=-Xmx2048m

# Reuse task outputs across builds (safe; opt-in per task by AGP/Kotlin).
org.gradle.caching=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
